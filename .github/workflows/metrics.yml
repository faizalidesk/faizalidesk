name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Metrik Utama (Kiri) - Tanpa Footer/Watermark
      - name: Main metrics (Left side)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: faizalidesk
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          config_footer: no  # <-- MENGHILANGKAN WATERMARK DI GAMBAR
          
          # Isometrik 3D Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Bahasa yang sering digunakan
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          
          # Starred Topics / Skill Icons
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20

      # 2. Metrik Kebiasaan & Aktivitas (Habits) - Tanpa Footer/Watermark
      - name: Habits & Streaks
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: faizalidesk
          base: ""
          config_footer: no  # <-- MENGHILANGKAN WATERMARK DI GAMBAR
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
