<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" fill="none">
  <style>
    .section-title { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .movie-title { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .genre { font: 400 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .rating { font: 600 9.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0883e; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .card-sub { fill: #0d1117; stroke: #21262d; stroke-width: 1px; rx: 5px; }
    .badge { fill: #21262d; rx: 3px; }
    .tag-movie { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffa657; }
    .tag-series { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7ee787; }
    .tag-anime { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #d2a8ff; }
    .music-title { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .music-artist { font: 400 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .terminal-text { font: 500 10.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #7ee787; }
    .terminal-dim { font: 500 10.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }
    .terminal-info { font: 500 10.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #58a6ff; }
  </style>

