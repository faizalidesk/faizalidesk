<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235" fill="none">
  <style>
    .movie-title { font: 600 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .genre { font: 400 9.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .rating { font: 600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0883e; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .badge { fill: #21262d; rx: 3px; }
    .tag-movie { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffa657; }
    .tag-series { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7ee787; }
  </style>

  <!-- ================= BARIS ATAS (3 KOTAK) ================= -->
  <!-- 1. MR. ROBOT -->
  <g transform="translate(5, 10)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">🤖 Mr. Robot</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 8.6</text>
    <text x="10" y="42" class="genre">Cybersecurity</text>
    <text x="10" y="56" class="genre">Psychology • Tech</text>
    <rect x="10" y="72" width="46" height="15" class="badge"/>
    <text x="14" y="83" class="tag-series">TV Series</text>
  </g>

  <!-- 2. INTERSTELLAR -->
  <g transform="translate(165, 10)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">🚀 Interstellar</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 8.7</text>
    <text x="10" y="42" class="genre">Astrophysics</text>
    <text x="10" y="56" class="genre">Deep Space • Nolan</text>
    <rect x="10" y="72" width="38" height="15" class="badge"/>
    <text x="14" y="83" class="tag-movie">Movie</text>
  </g>

  <!-- 3. THE MATRIX -->
  <g transform="translate(325, 10)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">🕶️ The Matrix</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 8.7</text>
    <text x="10" y="42" class="genre">Cyberpunk</text>
    <text x="10" y="56" class="genre">Simulation • AI</text>
    <rect x="10" y="72" width="38" height="15" class="badge"/>
    <text x="14" y="83" class="tag-movie">Movie</text>
  </g>

  <!-- ================= BARIS BAWAH (3 KOTAK) ================= -->
  <!-- 4. INCEPTION -->
  <g transform="translate(5, 120)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">🧠 Inception</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 8.8</text>
    <text x="10" y="42" class="genre">Mind-Bending</text>
    <text x="10" y="56" class="genre">Dream Heist • Nolan</text>
    <rect x="10" y="72" width="38" height="15" class="badge"/>
    <text x="14" y="83" class="tag-movie">Movie</text>
  </g>

  <!-- 5. SHERLOCK -->
  <g transform="translate(165, 120)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">🕵️‍♂️ Sherlock</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 9.1</text>
    <text x="10" y="42" class="genre">Deduction</text>
    <text x="10" y="56" class="genre">Forensic Crime • BBC</text>
    <rect x="10" y="72" width="46" height="15" class="badge"/>
    <text x="14" y="83" class="tag-series">TV Series</text>
  </g>

  <!-- 6. OPPENHEIMER -->
  <g transform="translate(325, 120)">
    <rect width="150" height="98" class="card"/>
    <text x="10" y="22" class="movie-title">⚛️ Oppenheimer</text>
    <rect x="96" y="11" width="44" height="14" class="badge"/>
    <text x="100" y="22" class="rating">★ 8.9</text>
    <text x="10" y="42" class="genre">Quantum Physics</text>
    <text x="10" y="56" class="genre">History • Nolan</text>
    <rect x="10" y="72" width="38" height="15" class="badge"/>
