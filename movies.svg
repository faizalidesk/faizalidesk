<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" fill="none">
  <style>
    .movie-title { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .genre { font: 400 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .rating { font: 600 9.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0883e; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .badge { fill: #21262d; rx: 3px; }
    .tag-movie { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffa657; }
    .tag-series { font: 500 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7ee787; }
    .anime-title { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ff7b72; }
    .terminal-text { font: 500 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #7ee787; }

    /* ANIMASI APUNGAN ANIME & GLOW */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    .floating-avatar { animation: float 2.5s ease-in-out infinite; }
  </style>

  <!-- ================= 1. GRID 6 FILM & SERIES (ATAS) ================= -->
  <!-- BARIS 1 -->
  <g transform="translate(5, 5)">
    <rect width="150" height="90" class="card"/>
