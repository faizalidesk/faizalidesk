    <rect x="98" y="11" width="42" height="14" class="badge"/>
    <text x="102" y="22" class="rating">★ 8.6</text>
    <text x="10" y="42" class="genre">Cybersecurity</text>
    <text x="10" y="55" class="genre">Psychology • Tech</text>
    <rect x="10" y="66" width="46" height="15" class="badge"/>
    <text x="14" y="77" class="tag-series">TV Series</text>
  </g>

  <g transform="translate(165, 5)">
    <rect width="150" height="90" class="card"/>
