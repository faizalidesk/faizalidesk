    <rect x="10" y="66" width="38" height="15" class="badge"/>
    <text x="14" y="77" class="tag-movie">Movie</text>
  </g>

  <!-- ================= 2. ANIME & CYBERPUNK VIBES (TENGAH BERANIMASI) ================= -->
  <g transform="translate(5, 205)">
    <rect width="470" height="140" class="card" stroke="#d2a8ff"/>

    <!-- Floating Anime Character Avatar -->
    <g class="floating-avatar" transform="translate(18, 20)">
      <circle cx="28" cy="28" r="26" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
      <!-- Pixel Art / Anime Icon -->
      <text x="15" y="38" font-size="28">✨</text>
    </g>

    <!-- Header Anime -->
    <text x="82" y="38" class="anime-title">⛩️ Anime &amp; Sci-Fi Universe</text>
    <text x="82" y="54" class="genre">Cyberpunk • Time Travel • Psychological Thriller</text>

    <!-- Live Animated Soundwave -->
    <g transform="translate(390, 24)">
      <rect x="0" y="8" width="3" height="16" fill="#d2a8ff" rx="1.5"><animate attributeName="height" values="16;4;20;8;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="6" y="2" width="3" height="22" fill="#d2a8ff" rx="1.5"><animate attributeName="height" values="22;10;4;18;22" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="12" y="10" width="3" height="12" fill="#d2a8ff" rx="1.5"><animate attributeName="height" values="12;22;8;4;12" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="18" y="0" width="3" height="24" fill="#d2a8ff" rx="1.5"><animate attributeName="height" values="24;8;20;14;24" dur="0.75s" repeatCount="indefinite"/></rect>
      <rect x="24" y="6" width="3" height="18" fill="#d2a8ff" rx="1.5"><animate attributeName="height" values="18;24;6;16;18" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Anime Badges List -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="105" height="22" class="badge"/>
      <text x="8" y="15" class="genre" fill="#79c0ff">🌌 Steins;Gate</text>

      <rect x="112" y="0" width="145" height="22" class="badge"/>
      <text x="120" y="15" class="genre" fill="#ff7b72">⚡ Cyberpunk Edgerunners</text>

      <rect x="264" y="0" width="90" height="22" class="badge"/>
      <text x="272" y="15" class="genre" fill="#d2a8ff">🤖 Evangelion</text>

      <rect x="361" y="0" width="75" height="22" class="badge"/>
      <text x="369" y="15" class="genre" fill="#ffa657">🦾 Akira</text>
    </g>

    <text x="18" y="124" class="genre" fill="#8b949e">🎧 Listening: Lofi Hip Hop / Synthwave Focus Mix</text>
  </g>

  <!-- ================= 3. TESTING & TECH STACK BADGES ================= -->
  <g transform="translate(5, 355)">
    <rect width="470" height="95" class="card"/>
    <text x="16" y="24" class="movie-title" fill="#58a6ff">⚡ Core Competencies &amp; Toolkit</text>
    
    <!-- Row Badges -->
    <rect x="16" y="36" width="80" height="22" class="badge"/>
    <text x="24" y="51" class="genre" fill="#7ee787">● QA Testing</text>

    <rect x="102" y="36" width="90" height="22" class="badge"/>
    <text x="110" y="51" class="genre" fill="#58a6ff">● Regression</text>

    <rect x="198" y="36" width="110" height="22" class="badge"/>
    <text x="206" y="51" class="genre" fill="#d2a8ff">● Multi-Tenant</text>

    <rect x="314" y="36" width="90" height="22" class="badge"/>
    <text x="322" y="51" class="genre" fill="#ffa657">● GitLab CI</text>

    <rect x="410" y="36" width="46" height="22" class="badge"/>
    <text x="418" y="51" class="genre" fill="#79c0ff">Vercel</text>

    <text x="16" y="80" class="genre" fill="#8b949e">🎯 Mission: Delivering zero-defect releases &amp; intuitive web interfaces.</text>
  </g>

  <!-- ================= 4. TERMINAL LIVE BANNER (PALING BAWAH) ================= -->
  <g transform="translate(5, 460)">
    <rect width="470" height="98" class="card" stroke="#238636"/>
    <!-- Terminal Header Dots -->
    <circle cx="20" cy="18" r="4" fill="#f85149"/>
    <circle cx="32" cy="18" r="4" fill="#e3b341"/>
    <circle cx="44" cy="18" r="4" fill="#2ea043"/>
    <text x="60" y="22" class="genre">bash — faizali@workspace:~$</text>

    <!-- Terminal Command & Output -->
    <text x="16" y="48" class="terminal-text">$ curl -s https://paisali.my.id/status</text>
    <text x="16" y="68" class="terminal-text" fill="#58a6ff">➔ HTTP 200 OK • Production Live • All Systems Operational</text>
    <text x="16" y="86" class="genre">Personal Portfolio: https://paisali.my.id</text>
